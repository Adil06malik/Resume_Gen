{% extends "base.html" %}
{% block title %}Login - AI Resume Tailor{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div style="max-width:400px; margin:80px auto;">
    <div class="card">
        <h2 style="margin-bottom:16px;">Login</h2>
        <div id="error" class="error" style="display:none;"></div>
        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" required>
            <label>Password</label>
            <input type="password" id="password" required>
            <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
        </form>
        <p style="margin-top:12px; font-size:13px; text-align:center;">
            No account? <a href="/register">Register</a>
        </p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    const body = new URLSearchParams();
    body.append('username', document.getElementById('email').value);
    body.append('password', document.getElementById('password').value);
    const resp = await fetch('/api/auth/login', { method: 'POST', body, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
    if (resp.ok) {
        const data = await resp.json();
        document.cookie = 'access_token=' + data.access_token + '; path=/; max-age=1800';
        window.location.href = '/dashboard';
    } else {
        const data = await resp.json();
        errEl.textContent = data.detail || 'Login failed';
        errEl.style.display = 'block';
    }
});
</script>
{% endblock %}
